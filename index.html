<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Información al Viajero</title>

<style>

body{
    font-family: Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

h1{
    color:#333;
}

select{
    padding:10px;
    min-width:320px;
    margin:5px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#resultado{
    margin-top:20px;
}

.ok{
    background:#e8f8e8;
    border:1px solid green;
    border-radius:5px;
    padding:15px;
}

.error{
    background:#fff5f5;
    border:1px solid red;
    border-radius:5px;
    padding:15px;
}

.info{
    margin-top:15px;
    background:#eef5ff;
    border:1px solid #0066cc;
    padding:15px;
    border-radius:5px;
}

</style>

</head>
<body>

<h1>🚆 Información al Viajero</h1>

<p>Seleccione origen y destino:</p>

<select id="origen">

    <option value="18000">
        Madrid-Atocha Cercanías
    </option>

    <option value="18001">
        Madrid-Recoletos
    </option>

    <option value="18002">
        Madrid-Nuevos Ministerios
    </option>

    <option value="18101">
        Sol
    </option>

    <option value="17000">
        Madrid-Chamartín-Clara Campoamor
    </option>

</select>

<select id="destino">

    <option value="17000">
        Madrid-Chamartín-Clara Campoamor
    </option>

    <option value="18000">
        Madrid-Atocha Cercanías
    </option>

    <option value="18001">
        Madrid-Recoletos
    </option>

    <option value="18002">
        Madrid-Nuevos Ministerios
    </option>

    <option value="18101">
        Sol
    </option>

</select>

<br><br>

<button onclick="buscarRuta()">
Buscar alternativa
</button>

<div id="resultado"></div>

<script>

async function obtenerRutas(){

    const r =
        await fetch("./rutas-madrid.json");

    return await r.json();

}

async function obtenerSalidas(){

    const r =
        await fetch("./salidas.json");

    return await r.json();

}

async function obtenerLineasAfectadas(){

    const r =
        await fetch("./incidencias.json");

    const datos =
        await r.json();

    const afectadas =
        new Set();

    datos.entity.forEach(entidad => {

        const texto =
            entidad.alert
            ?.descriptionText
            ?.translation?.[0]
            ?.text
            ?.toLowerCase() || "";

        const grave =

            texto.includes("sin servicio") ||
            texto.includes("interrumpido") ||
            texto.includes("suspendido") ||
            texto.includes("suprimido") ||
            texto.includes("suprimidos") ||
            texto.includes("no circulan");

        if(!grave){
            return;
        }

        entidad.alert
            ?.informedEntity
            ?.forEach(item => {

                const m =
                    item.routeId
                    ?.match(/C\d+[ab]?/i);

                if(m){

                    afectadas.add(
                        m[0].toUpperCase()
                    );

                }

            });

    });

    return [...afectadas];

}

async function buscarRuta(){

    const origen =
        document
        .getElementById("origen")
        .value;

    const destino =
        document
        .getElementById("destino")
        .value;

    if(origen === destino){

        document
        .getElementById("resultado")
        .innerHTML = `
            <div class="error">
                El origen y el destino son iguales.
            </div>
        `;

        return;

    }

    const rutas =
        await obtenerRutas();

    const salidas =
        await obtenerSalidas();

    const afectadas =
        await obtenerLineasAfectadas();

    const lineasPosibles = [];

    Object.entries(rutas)
        .forEach(([linea, estaciones]) => {

            if(
                estaciones.includes(origen)
                &&
                estaciones.includes(destino)
            ){

                lineasPosibles.push(linea);

            }

        });

    const disponibles =
        lineasPosibles.filter(
            linea =>

                !afectadas.includes(linea)

                &&

                salidas[origen]?.[linea]

        );

    disponibles.sort((a,b)=>{

        const horaA =
            salidas[origen]?.[a]
            || "99:99:99";

        const horaB =
            salidas[origen]?.[b]
            || "99:99:99";

        return horaA.localeCompare(
            horaB
        );

    });

    let html = "";

    if(disponibles.length){

        const recomendada =
            disponibles[0];

        html = `

        <div class="ok">

            <h2>
                ✅ Ruta recomendada
            </h2>

            <p>
                <strong>
                    Línea ${recomendada}
                </strong>
            </p>

            <p>

                Próxima salida detectada:

                <strong>

                    ${salidas[origen]?.[recomendada]}

                </strong>

            </p>

            <div class="info">

                <strong>
                    Alternativas disponibles
                </strong>

                <br><br>

                ${disponibles.map(
                    linea =>

                    `${linea}
                    (${salidas[origen]?.[linea]})`

                ).join("<br>")}

            </div>

        </div>

        `;

    }else{

        html = `

        <div class="error">

            <h2>
                🚨 Sin alternativa disponible
            </h2>

            <p>

                No existen líneas para este
                trayecto con datos de salida
                disponibles en este momento.

            </p>

        </div>

        `;

    }

    document
        .getElementById("resultado")
        .innerHTML = html;

}

</script>

</body>
</html>
