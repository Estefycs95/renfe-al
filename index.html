<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Incidencias Renfe</title>
</head>
<body>

<h1>🚆 Incidencias Renfe</h1>

<button onclick="cargar()">
Actualizar incidencias
</button>

<div id="resultado">
Pulsa el botón para cargar incidencias.
</div>

<script>

async function cargar(){

    const respuesta =
        await fetch("./incidencias.json");

    const datos =
        await respuesta.json();

    let html = "";

    datos.entity.forEach(e => {

        const alerta =
            e.alert;

        if(!alerta) return;

        const lineas =
            alerta.informedEntity
            ?.map(x => x.routeId)
            ?.join(", ");

        const texto =
            alerta.descriptionText
            ?.translation?.[0]
            ?.text || "";

        html += `
            <div style="
                border:1px solid red;
                padding:10px;
                margin-bottom:15px;
                background:#fff5f5;
            ">

                <b>Líneas:</b>
                ${lineas}

                <br><br>

                ${texto}

            </div>
        `;

    });

    document
        .getElementById("resultado")
        .innerHTML = html;

}

</script>

</body>
</html>
