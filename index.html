<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Información al Viajero</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

h1{
    color:#333;
}

select{
    padding:10px;
    min-width:350px;
    margin:5px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#resultado{
    margin-top:20px;
}

.ok{
    background:#e8f8e8;
    border:1px solid green;
    border-radius:5px;
    padding:15px;
}

.error{
    background:#fff4f4;
    border:1px solid red;
    border-radius:5px;
    padding:15px;
}

.info{
    margin-top:15px;
    background:#eef5ff;
    border:1px solid #0066cc;
    border-radius:5px;
    padding:15px;
}

.linea{
    padding:5px 0;
}

</style>

</head>

<body>

<h1>🚆 Información al Viajero</h1>

<p>Seleccione origen y destino</p>

<select id="origen"></select>

<select id="destino"></select>

<br><br>

<button onclick="buscarRuta()">
Buscar alternativa
</button>

<div id="resultado"></div>

<script>

async function obtenerEstaciones(){

    const r =
        await fetch("./estaciones-madrid.json");

    return await r.json();

}

async function obtenerRutas(){

    const r =
        await fetch("./rutas-madrid.json");

    return await r.json();

}

async function obtenerSalidas(){

    const r =
        await fetch("./salidas.json");

    return await r.json();

}

async function obtenerVehiculos(){

    const r =
        await fetch("./vehiculos_resumen.json");

    return await r.json();

}

async function obtenerLineasAfectadas(){

    const r =
        await fetch("./incidencias.json");

    const datos =
        await r.json();

    const afectadas =
        new Set();

    datos.entity.forEach(entidad => {

        const texto =
            entidad.alert
            ?.descriptionText
            ?.translation?.[0]
            ?.text
            ?.toLowerCase() || "";

        const grave =

            texto.includes("sin servicio") ||
            texto.includes("interrumpido") ||
            texto.includes("suspendido") ||
            texto.includes("suprimido") ||
            texto.includes("suprimidos") ||
            texto.includes("no circulan");

        if(!grave){
            return;
        }

        entidad.alert
            ?.informedEntity
            ?.forEach(item => {

                const m =
                    item.routeId
                    ?.match(/C\d+[ab]?/i);

                if(m){

                    afectadas.add(
                        m[0].toUpperCase()
                    );

                }

            });

    });

    return [...afectadas];

}

async function cargarEstaciones(){

    const estaciones =
        await obtenerEstaciones();

    const origen =
        document.getElementById(
            "origen"
        );

    const destino =
        document.getElementById(
            "destino"
        );

    origen.innerHTML = "";
    destino.innerHTML = "";

    Object.entries(estaciones)

        .sort((a,b)=>

            a[1].nombre.localeCompare(
                b[1].nombre,
                "es"
            )

        )

        .forEach(([id,datos]) => {

            const o1 =
                document.createElement(
                    "option"
                );

            o1.value = id;
            o1.textContent =
                datos.nombre;

            origen.appendChild(o1);

            const o2 =
                document.createElement(
                    "option"
                );

            o2.value = id;
            o2.textContent =
                datos.nombre;

            destino.appendChild(o2);

        });

    origen.value = "18000";
    destino.value = "17000";

}

async function buscarRuta(){

    const origen =
        document.getElementById(
            "origen"
        ).value;

    const destino =
        document.getElementById(
            "destino"
        ).value;

    if(origen === destino){

        document
            .getElementById(
                "resultado"
            )
            .innerHTML = `
                <div class="error">
                    El origen y el destino son iguales.
                </div>
            `;

        return;

    }

    const rutas =
        await obtenerRutas();

    const salidas =
        await obtenerSalidas();

    const vehiculos =
        await obtenerVehiculos();

    const estaciones =
        await obtenerEstaciones();

    const afectadas =
        await obtenerLineasAfectadas();

    const lineasPosibles = [];

    Object.entries(rutas)
        .forEach(([linea,paradas]) => {

            if(
                paradas.includes(origen)
                &&
                paradas.includes(destino)
            ){

                lineasPosibles.push(
                    linea
                );

            }

        });

    const disponibles =
        lineasPosibles.filter(
            linea =>

                !afectadas.includes(linea)

                &&

                salidas[origen]?.[linea]
        );

    disponibles.sort((a,b)=>{

        const distanciaA =
            vehiculos[origen]?.[a] ??
            999;

        const distanciaB =
            vehiculos[origen]?.[b] ??
            999;

        if(
            distanciaA !== distanciaB
        ){

            return (
                distanciaA -
                distanciaB
            );

        }

        const horaA =
            salidas[origen]?.[a]
            || "99:99:99";

        const horaB =
            salidas[origen]?.[b]
            || "99:99:99";

        return horaA.localeCompare(
            horaB
        );

    });

    let html = "";

    if(disponibles.length){

        const recomendada =
            disponibles[0];

        html = `

        <div class="ok">

            <h2>
                ✅ Ruta recomendada
            </h2>

            <p>

                <strong>
                    ${recomendada}
                </strong>

            </p>

            <p>

                Próxima salida:

                <strong>
                    ${salidas[origen]?.[recomendada]}
                </strong>

            </p>

            <p>

                Tren más cercano detectado:

                <strong>
                    ${vehiculos[origen]?.[recomendada] ?? "?"} km
                </strong>

            </p>

            <div class="info">

                <strong>
                    Alternativas
                </strong>

                <br><br>

                ${disponibles.map(
                    linea =>

                    `<div class="linea">

                    <strong>${linea}</strong>

                    · Salida:

                    ${salidas[origen]?.[linea]}

                    · Distancia:

                    ${vehiculos[origen]?.[linea] ?? "?"} km

                    </div>`

                ).join("")}

            </div>

        </div>

        `;

    }else{

        html = `

        <div class="error">

            <h2>
                🚨 Sin alternativa disponible
            </h2>

            <p>

                No se han encontrado
                líneas disponibles para
                este trayecto.

            </p>

        </div>

        `;

    }

    document
        .getElementById(
            "resultado"
        )
        .innerHTML = html;

}

window.onload = () => {

    cargarEstaciones();

};

</script>

</body>
</html>
