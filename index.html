<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Información al Viajero</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

select{
    width:100%;
    margin:5px 0;
    padding:10px;
}

button{
    padding:12px 20px;
    margin-top:10px;
    cursor:pointer;
}

.card{
    margin-top:20px;
    padding:15px;
    border-radius:8px;
    border:1px solid #ddd;
}

.ok{
    background:#eefbea;
}

.linea{
    margin-top:10px;
    padding:10px;
    border-top:1px solid #ddd;
}

</style>
</head>

<body>

<h1>🚆 Información al Viajero</h1>

<select id="origen"></select>
<select id="destino"></select>

<button onclick="buscarRuta()">
Buscar
</button>

<div id="resultado"></div>

<script>

async function cargarJSON(nombre){

    const r =
        await fetch(nombre);

    return await r.json();

}

function nombreEstacion(
    estaciones,
    codigo
){

    return estaciones[codigo]?.nombre
        || codigo;

}

function obtenerDistancia(
    vehiculos,
    estacion,
    linea
){

    const datos =
        vehiculos?.[estacion];

    if(!datos){
        return null;
    }

    if(
        datos[linea] != null
    ){
        return datos[linea];
    }

    if(linea === "C4"){

        const a =
            datos["C4A"];

        const b =
            datos["C4B"];

        return Math.min(
            a ?? 999,
            b ?? 999
        );

    }

    if(linea === "C8"){

        const a =
            datos["C8A"];

        const b =
            datos["C8B"];

        return Math.min(
            a ?? 999,
            b ?? 999
        );

    }

    return null;

}

function obtenerSentidoCorrecto(
    sentidos,
    rutas,
    linea,
    origen,
    destino
){

    let trenes = [];

    if(sentidos[linea]){

        trenes =
            sentidos[linea];

    }

    if(
        linea === "C4"
    ){

        trenes = [

            ...(sentidos["C4A"] || []),

            ...(sentidos["C4B"] || [])

        ];

    }

    if(
        linea === "C8"
    ){

        trenes = [

            ...(sentidos["C8A"] || []),

            ...(sentidos["C8B"] || [])

        ];

    }

    if(
        !trenes.length
    ){
        return null;
    }

    const recorrido =
        rutas[linea];

    if(
        !recorrido
    ){
        return trenes[0];
    }

    const pOrigen =
        recorrido.indexOf(
            origen
        );

    const pDestino =
        recorrido.indexOf(
            destino
        );

    if(
        pOrigen === -1 ||
        pDestino === -1
    ){
        return trenes[0];
    }

    const ida =
        pDestino > pOrigen;

    const candidatos =

        trenes.filter(
            tren => {

                const i1 =
                    recorrido.indexOf(
                        tren.origen_viaje
                    );

                const i2 =
                    recorrido.indexOf(
                        tren.destino_viaje
                    );

                if(
                    i1 === -1 ||
                    i2 === -1
                ){
                    return false;
                }

                return ida
                    ? i2 > i1
                    : i2 < i1;

            }
        );

    return candidatos[0]
        || trenes[0];

}

async function buscarRuta(){

    const estaciones =
        await cargarJSON(
            "estaciones-madrid.json"
        );

    const rutas =
        await cargarJSON(
            "rutas-madrid.json"
        );

    const vehiculos =
        await cargarJSON(
            "vehiculos_resumen.json"
        );

    const sentidos =
        await cargarJSON(
            "sentidos_resumen.json"
        );

    const origen =
        document.getElementById(
            "origen"
        ).value;

    const destino =
        document.getElementById(
            "destino"
        ).value;

    const lineas = [];

    Object.entries(rutas)

        .forEach(
            ([linea,recorrido])=>{

            if(

                recorrido.includes(
                    origen
                )

                &&

                recorrido.includes(
                    destino
                )

            ){

                lineas.push(
                    linea
                );

            }

        });

    if(
        !lineas.length
    ){

        document
            .getElementById(
                "resultado"
            )
            .innerHTML =

            `
            <div class="card">
            No se ha encontrado ruta.
            </div>
            `;

        return;

    }

    lineas.sort((a,b)=>{

        const da =
            obtenerDistancia(
                vehiculos,
                origen,
                a
            ) ?? 999;

        const db =
            obtenerDistancia(
                vehiculos,
                origen,
                b
            ) ?? 999;

        return da - db;

    });

    const mejor =
        lineas[0];

    const tren =
        obtenerSentidoCorrecto(
            sentidos,
            rutas,
            mejor,
            origen,
            destino
        );

    let html =

    `
    <div class="card ok">

    <h2>
    ✅ Ruta recomendada
    </h2>

    <h3>
    ${mejor}
    </h3>

    <p>

    Destino del tren:

    <strong>

    ${
        tren
        ?
        nombreEstacion(
            estaciones,
            tren.destino_viaje
        )
        :
        "No disponible"
    }

    </strong>

    </p>

    <p>

    Tren detectado en:

    <strong>

    ${
        tren
        ?
        nombreEstacion(
            estaciones,
            tren.proxima_estacion
        )
        :
        "No disponible"
    }

    </strong>

    </p>

    <hr>

    <h3>
    Alternativas
    </h3>
    `;

    lineas.forEach(
        linea => {

        const t =
            obtenerSentidoCorrecto(
                sentidos,
                rutas,
                linea,
                origen,
                destino
            );

        html +=

        `
        <div class="linea">

        <strong>
        ${linea}
        </strong>

        <br>

        Destino:

        ${
            t
            ?
            nombreEstacion(
                estaciones,
                t.destino_viaje
            )
            :
            "No disponible"
        }

        </div>
        `;

    });

    html +=
    "</div>";

    document
        .getElementById(
            "resultado"
        )
        .innerHTML = html;

}

async function iniciar(){

    const estaciones =
        await cargarJSON(
            "estaciones-madrid.json"
        );

    const origen =
        document.getElementById(
            "origen"
        );

    const destino =
        document.getElementById(
            "destino"
        );

    Object.entries(estaciones)

        .sort(
            (a,b)=>

            a[1].nombre.localeCompare(
                b[1].nombre
            )
        )

        .forEach(
            ([id,datos])=>{

            origen.innerHTML +=

            `<option value="${id}">
            ${datos.nombre}
            </option>`;

            destino.innerHTML +=

            `<option value="${id}">
            ${datos.nombre}
            </option>`;

        });

}

iniciar();

</script>

</body>
</html>
