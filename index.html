<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Información al Viajero</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 20px auto;
    padding: 20px;
}

h1{
    color:#333;
}

select{
    padding:10px;
    margin:5px;
    min-width:300px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#resultado{
    margin-top:20px;
}

.ok{
    background:#e8f8e8;
    border:1px solid green;
    padding:15px;
    border-radius:5px;
}

.error{
    background:#fff5f5;
    border:1px solid red;
    padding:15px;
    border-radius:5px;
}

</style>

</head>
<body>

<h1>🚆 Información al Viajero</h1>

<p>Seleccione origen y destino:</p>

<select id="origen">
    <option value="18000">Madrid-Atocha Cercanías</option>
    <option value="18001">Madrid-Recoletos</option>
    <option value="18002">Madrid-Nuevos Ministerios</option>
    <option value="18101">Sol</option>
    <option value="17000">Madrid-Chamartín-Clara Campoamor</option>
</select>

<select id="destino">
    <option value="17000">Madrid-Chamartín-Clara Campoamor</option>
    <option value="18000">Madrid-Atocha Cercanías</option>
    <option value="18001">Madrid-Recoletos</option>
    <option value="18002">Madrid-Nuevos Ministerios</option>
    <option value="18101">Sol</option>
</select>

<br><br>

<button onclick="buscarRuta()">
Buscar alternativa
</button>

<div id="resultado"></div>

<script>

async function obtenerLineasAfectadas(){

    const respuesta =
        await fetch("./incidencias.json");

    const datos =
        await respuesta.json();

    const afectadas =
        new Set();

    datos.entity.forEach(entidad => {

        entidad.alert
            ?.informedEntity
            ?.forEach(item => {

                const match =
                    item.routeId
                    ?.match(/C\d+[ab]?/i);

                if(match){

                    afectadas.add(
                        match[0].toUpperCase()
                    );

                }

            });

    });

    return [...afectadas];

}

async function obtenerRutas(){

    const respuesta =
        await fetch("./rutas-madrid.json");

    return await respuesta.json();

}

async function buscarRuta(){

    const origen =
        document.getElementById(
            "origen"
        ).value;

    const destino =
        document.getElementById(
            "destino"
        ).value;

    if(origen === destino){

        document
            .getElementById("resultado")
            .innerHTML = `
                <div class="error">
                    El origen y el destino son iguales.
                </div>
            `;

        return;
    }

    const rutas =
        await obtenerRutas();

    const afectadas =
        await obtenerLineasAfectadas();

    const lineasPosibles = [];

    Object.entries(rutas)
        .forEach(([linea, estaciones]) => {

            const origenExiste =
                estaciones.includes(origen);

            const destinoExiste =
                estaciones.includes(destino);

            if(
                origenExiste &&
                destinoExiste
            ){

                lineasPosibles.push(linea);

            }

        });

    const disponibles =
    lineasPosibles.filter(
        linea =>
        !afectadas.includes(linea)
    );

console.log("Lineas posibles:", lineasPosibles);
console.log("Afectadas:", afectadas);
console.log("Disponibles:", disponibles);

let html = "";


    if(disponibles.length > 0){

        html = `
            <div class="ok">

                <h2>
                ✅ Ruta recomendada
                </h2>

                <p>

                Utilice la línea:

                <strong>
                ${disponibles[0]}
                </strong>

                </p>

                <p>

                Alternativas disponibles:

                ${disponibles.join(", ")}

                </p>

            </div>
        `;

    }else{

        html = `
            <div class="error">

                <h2>
                🚨 Sin alternativa disponible
                </h2>

                <p>

                Todas las líneas identificadas
                para este trayecto presentan
                incidencias o no existen datos.

                </p>

            </div>
        `;

    }

    document
        .getElementById("resultado")
        .innerHTML = html;

}

</script>

</body>
</html>
