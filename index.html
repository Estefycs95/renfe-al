<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Información al Viajero</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

select{
    padding: 10px;
    min-width: 350px;
    margin: 5px;
}

button{
    padding: 10px 20px;
    cursor: pointer;
}

#resultado{
    margin-top: 20px;
}

.ok{
    background:#e8f8e8;
    border:1px solid green;
    border-radius:5px;
    padding:15px;
}

.error{
    background:#fff4f4;
    border:1px solid red;
    border-radius:5px;
    padding:15px;
}

.info{
    margin-top:15px;
    background:#eef5ff;
    border:1px solid #0066cc;
    border-radius:5px;
    padding:15px;
}

.linea{
    padding:5px 0;
}

</style>
</head>

<body>

<h1>🚆 Información al Viajero</h1>

<p>Seleccione origen y destino</p>

<select id="origen"></select>
<select id="destino"></select>

<br><br>

<button onclick="buscarRuta()">
Buscar alternativa
</button>

<div id="resultado"></div>

<script>

async function obtenerEstaciones(){
    const r = await fetch("./estaciones-madrid.json");
    return await r.json();
}

async function obtenerRutas(){
    const r = await fetch("./rutas-madrid.json");
    return await r.json();
}

async function obtenerSalidas(){
    const r = await fetch("./salidas.json");
    return await r.json();
}

async function obtenerVehiculos(){
    const r = await fetch("./vehiculos_resumen.json");
    return await r.json();
}

async function obtenerLineasAfectadas(){

    const r = await fetch("./incidencias.json");

    const datos = await r.json();

    const afectadas = new Set();

    datos.entity?.forEach(entidad => {

        const texto =
            entidad.alert
            ?.descriptionText
            ?.translation?.[0]
            ?.text
            ?.toLowerCase() || "";

        const grave =

            texto.includes("sin servicio") ||
            texto.includes("interrumpido") ||
            texto.includes("suspendido") ||
            texto.includes("suprimido") ||
            texto.includes("suprimidos") ||
            texto.includes("no circulan");

        if(!grave){
            return;
        }

        entidad.alert?.informedEntity?.forEach(item => {

            const m =
                item.routeId
                ?.match(/C\d+[ABab]?/i);

            if(m){
                afectadas.add(
                    m[0].toUpperCase()
                );
            }

        });

    });

    return [...afectadas];

}

async function cargarEstaciones(){

    const estaciones =
        await obtenerEstaciones();

    const origen =
        document.getElementById(
            "origen"
        );

    const destino =
        document.getElementById(
            "destino"
        );

    Object.entries(estaciones)

        .sort((a,b)=>

            a[1].nombre.localeCompare(
                b[1].nombre,
                "es"
            )

        )

        .forEach(([id,datos])=>{

            const o1 =
                document.createElement(
                    "option"
                );

            o1.value = id;
            o1.textContent =
                datos.nombre;

            origen.appendChild(
                o1
            );

            const o2 =
                document.createElement(
                    "option"
                );

            o2.value = id;
            o2.textContent =
                datos.nombre;

            destino.appendChild(
                o2
            );

        });

    origen.value = "18000";
    destino.value = "17000";

}

function obtenerDistancia(
    vehiculos,
    estacion,
    linea
){

    const datos =
        vehiculos[estacion];

    if(!datos){
        return null;
    }

    if(datos[linea] != null){
        return datos[linea];
    }

    if(linea === "C4"){

        const a = datos["C4A"];
        const b = datos["C4B"];

        if(a != null && b != null){
            return Math.min(a,b);
        }

        return a ?? b ?? null;
    }

    if(linea === "C8"){

        const a = datos["C8A"];
        const b = datos["C8B"];

        if(a != null && b != null){
            return Math.min(a,b);
        }

        return a ?? b ?? null;
    }

    return null;

}

function obtenerHora(
    salidas,
    estacion,
    linea
){

    const datos =
        salidas[estacion];

    if(!datos){
        return null;
    }

    if(datos[linea]){
        return datos[linea];
    }

    if(linea === "C4"){

        return (
            datos["C4A"]
            ||
            datos["C4B"]
            ||
            null
        );
    }

    if(linea === "C8"){

        return (
            datos["C8A"]
            ||
            datos["C8B"]
            ||
            null
        );
    }

    return null;

}

async function buscarRuta(){

    const origen =
        document.getElementById(
            "origen"
        ).value;

    const destino =
        document.getElementById(
            "destino"
        ).value;

    if(origen === destino){

        document
        .getElementById(
            "resultado"
        )
        .innerHTML = `
        <div class="error">
        El origen y el destino son iguales.
        </div>`;

        return;
    }

    const rutas =
        await obtenerRutas();

    const salidas =
        await obtenerSalidas();

    const vehiculos =
        await obtenerVehiculos();

    const afectadas =
        await obtenerLineasAfectadas();

    const lineasPosibles = [];

    Object.entries(rutas)

        .forEach(([linea, estaciones]) => {

            if(
                estaciones.includes(origen)
                &&
                estaciones.includes(destino)
            ){

                lineasPosibles.push(
                    linea
                );

            }

        });

    const disponibles =
        lineasPosibles.filter(
            linea =>
            !afectadas.includes(
                linea
            )
        );

    disponibles.sort((a,b)=>{

        const da =
            obtenerDistancia(
                vehiculos,
                origen,
                a
            ) ?? 999;

        const db =
            obtenerDistancia(
                vehiculos,
                origen,
                b
            ) ?? 999;

        return da - db;

    });

    if(!disponibles.length){

        document
        .getElementById(
            "resultado"
        )
        .innerHTML = `
        <div class="error">
        <h2>🚨 Sin alternativa disponible</h2>
        </div>
        `;

        return;

    }

    const recomendada =
        disponibles[0];

    const distancia =
        obtenerDistancia(
            vehiculos,
            origen,
            recomendada
        );

    const hora =
        obtenerHora(
            salidas,
            origen,
            recomendada
        );

    let html = `

    <div class="ok">

        <h2>
        ✅ Ruta recomendada
        </h2>

        <h3>
        ${recomendada}
        </h3>

        <p>

        Horario:

        <strong>
        ${
            hora ??
            "No disponible"
        }
        </strong>

        </p>

        <p>

        Tren más cercano:

        <strong>

        ${
            distancia != null
            ? distancia + " km"
            : "No disponible"
        }

        </strong>

        </p>

        <div class="info">

            <strong>
            Alternativas disponibles
            </strong>

            <br><br>

    `;

    disponibles.forEach(linea=>{

        const d =
            obtenerDistancia(
                vehiculos,
                origen,
                linea
            );

        const h =
            obtenerHora(
                salidas,
                origen,
                linea
            );

        html += `

        <div class="linea">

        <strong>${linea}</strong>

        · Horario:

        ${
            h ??
            "No disponible"
        }

        · Distancia:

        ${
            d != null
            ? d + " km"
            : "No disponible"
        }

        </div>

        `;

    });

    html += `
        </div>
    </div>
    `;

    document
    .getElementById(
        "resultado"
    )
    .innerHTML = html;

}

window.onload = () => {

    cargarEstaciones();

};

</script>

</body>
</html>
