<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Información al Viajero</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

select{
    padding:10px;
    min-width:350px;
    margin:5px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#resultado{
    margin-top:20px;
}

.ok{
    background:#e8f8e8;
    border:1px solid green;
    border-radius:5px;
    padding:15px;
}

.error{
    background:#fff4f4;
    border:1px solid red;
    border-radius:5px;
    padding:15px;
}

.info{
    margin-top:15px;
    background:#eef5ff;
    border:1px solid #0066cc;
    border-radius:5px;
    padding:15px;
}

.linea{
    padding:5px 0;
}

</style>

</head>

<body>

<h1>🚆 Información al Viajero</h1>

<p>Seleccione origen y destino</p>

<select id="origen"></select>
<select id="destino"></select>

<br><br>

<button onclick="buscarRuta()">
Buscar alternativa
</button>

<div id="resultado"></div>

<script>

async function obtenerEstaciones(){
    const r = await fetch("./estaciones-madrid.json");
    return await r.json();
}

async function obtenerRutas(){
    const r = await fetch("./rutas-madrid.json");
    return await r.json();
}

async function obtenerVehiculos(){
    const r = await fetch("./vehiculos_resumen.json");
    return await r.json();
}

async function obtenerSentidos(){
    const r = await fetch("./sentidos_resumen.json");
    return await r.json();
}

async function obtenerLineasAfectadas(){

    const r = await fetch("./incidencias.json");

    const datos = await r.json();

    const afectadas = new Set();

    datos.entity?.forEach(entidad => {

        const texto =
            entidad.alert
            ?.descriptionText
            ?.translation?.[0]
            ?.text
            ?.toLowerCase() || "";

        const grave =

            texto.includes("sin servicio") ||
            texto.includes("interrumpido") ||
            texto.includes("suspendido") ||
            texto.includes("suprimido") ||
            texto.includes("suprimidos") ||
            texto.includes("no circulan");

        if(!grave){
            return;
        }

        entidad.alert?.informedEntity?.forEach(item => {

            const m =
                item.routeId?.match(
                    /C\d+[ABab]?/i
                );

            if(m){
                afectadas.add(
                    m[0].toUpperCase()
                );
            }

        });

    });

    return [...afectadas];

}

async function cargarEstaciones(){

    const estaciones =
        await obtenerEstaciones();

    const origen =
        document.getElementById("origen");

    const destino =
        document.getElementById("destino");

    Object.entries(estaciones)

        .sort((a,b)=>
            a[1].nombre.localeCompare(
                b[1].nombre,
                "es"
            )
        )

        .forEach(([id,datos])=>{

            const o1 =
                document.createElement(
                    "option"
                );

            o1.value = id;
            o1.textContent =
                datos.nombre;

            origen.appendChild(o1);

            const o2 =
                document.createElement(
                    "option"
                );

            o2.value = id;
            o2.textContent =
                datos.nombre;

            destino.appendChild(o2);

        });

}

function obtenerDistancia(
    vehiculos,
    estacion,
    linea
){

    const datos =
        vehiculos[estacion];

    if(!datos){
        return null;
    }

    if(datos[linea] != null){
        return datos[linea];
    }

    if(linea === "C4"){

        return Math.min(
            datos["C4A"] ?? 999,
            datos["C4B"] ?? 999
        );

    }

    if(linea === "C8"){

        return Math.min(
            datos["C8A"] ?? 999,
            datos["C8B"] ?? 999
        );

    }

    return null;

}

function obtenerSentido(
    sentidos,
    estacion,
    linea
){

    const info =
        sentidos?.[estacion];

    if(!info){
        return null;
    }

    if(info[linea]){
        return info[linea];
    }

    if(linea === "C4"){

        return (
            info["C4A"]
            ||
            info["C4B"]
            ||
            null
        );

    }

    if(linea === "C8"){

        return (
            info["C8A"]
            ||
            info["C8B"]
            ||
            null
        );

    }

    return null;

}

async function buscarRuta(){

    const origen =
        document.getElementById(
            "origen"
        ).value;

    const destino =
        document.getElementById(
            "destino"
        ).value;

    if(origen === destino){

        document
            .getElementById(
                "resultado"
            )
            .innerHTML =
            `
            <div class="error">
            El origen y destino son iguales.
            </div>
            `;

        return;
    }

    const rutas =
        await obtenerRutas();

    const vehiculos =
        await obtenerVehiculos();

    const sentidos =
        await obtenerSentidos();

    const afectadas =
        await obtenerLineasAfectadas();

    const lineasPosibles = [];

    Object.entries(rutas)

        .forEach(([linea,
            estaciones])=>{

            if(

                estaciones.includes(
                    origen
                )

                &&

                estaciones.includes(
                    destino
                )

            ){

                lineasPosibles.push(
                    linea
                );

            }

        });

    const disponibles =

        lineasPosibles.filter(
            linea =>
                !afectadas.includes(
                    linea
                )
        );

    disponibles.sort((a,b)=>{

        const da =

            obtenerDistancia(
                vehiculos,
                origen,
                a
            ) ?? 999;

        const db =

            obtenerDistancia(
                vehiculos,
                origen,
                b
            ) ?? 999;

        return da - db;

    });

    if(!disponibles.length){

        document
            .getElementById(
                "resultado"
            )
            .innerHTML =

            `
            <div class="error">
            <h2>
            🚨 Sin alternativa disponible
            </h2>
            </div>
            `;

        return;

    }

    const recomendada =
        disponibles[0];

    const distancia =

        obtenerDistancia(
            vehiculos,
            origen,
            recomendada
        );

    const sentido =

        obtenerSentido(
            sentidos,
            origen,
            recomendada
        );

    let html =

    `
    <div class="ok">

        <h2>
        ✅ Ruta recomendada
        </h2>

        <h3>
        ${recomendada}
        </h3>

        <p>

        Próxima estación:

        <strong>

        ${
            sentido?.proxima_estacion
            || "No disponible"
        }

        </strong>

        </p>

        <p>

        Destino del tren:

        <strong>

        ${
            sentido?.destino_viaje
            || "No disponible"
        }

        </strong>

        </p>

        <p>

        Distancia:

        <strong>

        ${
            distancia != null
            ? distancia + " km"
            : "No disponible"
        }

        </strong>

        </p>

        <div class="info">

        <strong>
        Alternativas
        </strong>

        <br><br>
    `;

    disponibles.forEach(linea=>{

        const d =

            obtenerDistancia(
                vehiculos,
                origen,
                linea
            );

        const s =

            obtenerSentido(
                sentidos,
                origen,
                linea
            );

        html +=

        `
        <div class="linea">

        <strong>
        ${linea}
        </strong>

        · Destino:

        ${
            s?.destino_viaje
            || "No disponible"
        }

        · Distancia:

        ${
            d != null
            ? d + " km"
            : "No disponible"
        }

        </div>
        `;

    });

    html +=
    `
    </div>
    </div>
    `;

    document
        .getElementById(
            "resultado"
        )
        .innerHTML = html;

}

window.onload = () => {

    cargarEstaciones();

};

</script>

</body>
</html>
