name: Generar rutas Madrid

name: Generar rutas Madrid

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  generar:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar GTFS
        run: |
          curl -L https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip \
          -o fomento_transit.zip

      - name: Descomprimir GTFS
        run: |
          unzip -o fomento_transit.zip

      - name: Instalar dependencias
        run: |
          pip install gtfs-realtime-bindings requests protobuf

      - name: Generar estaciones
        run: |
          python generar_estaciones_madrid.py

      - name: Generar rutas
        run: |
          python generar_rutas.py

      - name: Generar sentidos
        run: |
          python generar_sentidos.py

      - name: Generar resumen sentidos
        run: |
          python generar_resumen_sentidos.py

      - name: Actualizar incidencias
        run: |
          python generar_incidencias.py

      - name: Commit cambios
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add *.json

          if ! git diff --cached --quiet; then

            git commit -m "Actualizar datos Cercanias"

            git pull --rebase origin main

            git push origin main

          else

            echo "Sin cambios"

          fi
