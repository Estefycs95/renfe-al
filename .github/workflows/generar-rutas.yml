name: Generar rutas Madrid

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  generar:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar GTFS
        run: |
          curl -L \
          https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip \
          -o fomento_transit.zip

      - name: Descomprimir
        run: |
          unzip -o fomento_transit.zip

      - name: Instalar dependencias
        run: |
          pip install gtfs-realtime-bindings requests protobuf

      - name: Generar estaciones Madrid
        run: |
          python generar_estaciones_madrid.py

      - name: Generar rutas
        run: |
          python generar_rutas.py

      - name: Generar sentidos
        run: |
          python generar_sentidos.py

      - name: Generar resumen sentidos
        run: |
          python generar_resumen_sentidos.py

      - name: Generar resumen por línea
        run: |
          python generar_resumen_sentidos.py


      - name: Commit cambios
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add estaciones-madrid.json
          git add rutas-madrid.json
          git add vehiculos_sentido.json
          git add sentidos_resumen.json
          git add sentidos_linea.json

          if ! git diff --cached --quiet; then

            git commit -m "Actualizar datos Cercanias"

            git pull --rebase origin main

            git push origin main

          fi
