name: Actualizar incidencias Renfe

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar incidencias
        run: curl https://gtfsrt.renfe.com/alerts.json -o incidencias.json

      - name: Commit cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add incidencias.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar incidencias"
            git push
          fi
