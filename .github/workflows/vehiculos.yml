name: Actualizar vehiculos

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          pip install gtfs-realtime-bindings requests protobuf

      - name: Descargar posiciones
        run: |
          python descargar_vehiculos.py

      - name: Commit cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add vehiculos.json
          git add vehiculos_resumen.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar vehiculos"
            git push
          fi
